apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-detection-config
  namespace: fraud-detection
data:
  MODEL_PATH: "/app/models/fraud_pipeline.joblib"
  MLFLOW_TRACKING_URI: "http://mlflow.fraud-detection.svc.cluster.local:5000"
  MLFLOW_MODEL_NAME: "fraud-detection"
  MLFLOW_MODEL_STAGE: "Production"
  LOG_LEVEL: "INFO"
  WORKERS: "4"
  HOST: "0.0.0.0"
  PORT: "8000"
  FRAUD_THRESHOLD: "0.5"
  ALLOWED_ORIGINS: '["*"]'
  ALLOWED_HOSTS: '["*"]'
