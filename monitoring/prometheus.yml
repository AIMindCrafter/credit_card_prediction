global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "credit-card-fraud-detection"
    environment: "production"

scrape_configs:
  - job_name: "fraud-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []
